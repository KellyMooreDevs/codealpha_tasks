<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordbridge — Translate</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap');

  :root {
    --paper: #FAF8F3;
    --surface: #EFEAE0;
    --ink: #1B2A4A;
    --ink-soft: #46537A;
    --gold: #B8902E;
    --gold-dark: #8F6E20;
    --border: #DCD5C4;
    --error: #A8402F;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header {
    margin-bottom: 40px;
  }

  header h1 {
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 2.1rem;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  header p {
    font-family: 'Lora', serif;
    font-style: italic;
    color: var(--ink-soft);
    margin: 0;
    font-size: 1.02rem;
  }

  .lang-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  select {
    font-family: 'Inter', sans-serif;
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 12px;
    cursor: pointer;
  }

  select:focus-visible, button:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .swap-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--ink-soft);
    transition: transform 0.2s ease, border-color 0.2s ease;
    flex-shrink: 0;
  }

  .swap-btn:hover {
    border-color: var(--gold);
    color: var(--gold-dark);
  }

  .swap-btn.spin {
    transform: rotate(180deg);
  }

  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    align-items: start;
  }

  @media (max-width: 680px) {
    .panels { grid-template-columns: 1fr; }
    .lang-row { flex-wrap: wrap; }
  }

  .panel {
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .panel-label {
    font-size: 0.78rem;
    color: var(--ink-soft);
    padding: 10px 14px 0;
  }

  textarea {
    width: 100%;
    border: none;
    resize: vertical;
    font-family: 'Inter', sans-serif;
    font-size: 1.02rem;
    line-height: 1.5;
    padding: 8px 14px 14px;
    min-height: 160px;
    color: var(--ink);
    background: transparent;
  }

  textarea:focus { outline: none; }

  #output {
    color: var(--ink);
  }

  #output.placeholder {
    color: #A9A290;
  }

  .panel-tools {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    padding: 0 10px 10px;
  }

  .icon-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.8rem;
    font-family: 'Inter', sans-serif;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .icon-btn:hover {
    background: var(--surface);
    color: var(--ink);
  }

  .icon-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .icon-btn:disabled:hover {
    background: none;
    color: var(--ink-soft);
  }

  .action-row {
    margin-top: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .translate-btn {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 6px;
    padding: 12px 26px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .translate-btn:hover { background: #10192E; }

  .translate-btn:disabled {
    background: #B9B2A0;
    cursor: default;
  }

  .status {
    font-size: 0.85rem;
    color: var(--ink-soft);
    min-height: 1.2em;
  }

  .status.error { color: var(--error); }

  footer {
    margin-top: 56px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    font-size: 0.8rem;
    color: var(--ink-soft);
  }

  footer a { color: var(--gold-dark); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Wordbridge</h1>
    <p>Type a passage, pick two languages, and let it cross over.</p>
  </header>

  <div class="lang-row">
    <select id="sourceLang" aria-label="Source language"></select>
    <button class="swap-btn" id="swapBtn" title="Swap languages" aria-label="Swap languages">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4"/><path d="M3 7h18"/><path d="M7 21l-4-4 4-4"/><path d="M21 17H3"/></svg>
    </button>
    <select id="targetLang" aria-label="Target language"></select>
  </div>

  <div class="panels">
    <div class="panel">
      <div class="panel-label">Original</div>
      <textarea id="inputText" placeholder="Start typing… (up to 500 characters)" maxlength="500"></textarea>
      <div class="panel-tools">
        <button class="icon-btn" id="speakInput" title="Listen to original">🔊 Listen</button>
        <button class="icon-btn" id="clearInput" title="Clear">✕ Clear</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-label">Translation</div>
      <textarea id="output" class="placeholder" placeholder="Your translation will appear here." readonly></textarea>
      <div class="panel-tools">
        <button class="icon-btn" id="speakOutput" title="Listen to translation" disabled>🔊 Listen</button>
        <button class="icon-btn" id="copyOutput" title="Copy translation" disabled>⧉ Copy</button>
      </div>
    </div>
  </div>

  <div class="action-row">
    <button class="translate-btn" id="translateBtn">Translate</button>
    <span class="status" id="status"></span>
  </div>

  <footer>
    Powered by the free <a href="https://mymemory.translated.net" target="_blank" rel="noopener">MyMemory</a> translation API. Built by Maurice Essilfie Kumi.
  </footer>
</div>

<script>
  const LANGS = [
    { code: 'en', name: 'English' },
    { code: 'fr', name: 'French' },
    { code: 'es', name: 'Spanish' },
    { code: 'de', name: 'German' },
    { code: 'it', name: 'Italian' },
    { code: 'pt', name: 'Portuguese' },
    { code: 'ru', name: 'Russian' },
    { code: 'ar', name: 'Arabic' },
    { code: 'zh', name: 'Chinese' },
    { code: 'ja', name: 'Japanese' },
    { code: 'ko', name: 'Korean' },
    { code: 'hi', name: 'Hindi' },
    { code: 'nl', name: 'Dutch' },
    { code: 'tr', name: 'Turkish' },
    { code: 'sw', name: 'Swahili' }
  ];

  // MyMemory's public translation API — free, no signup, and CORS-enabled
  // so it works from a browser (unlike most public LibreTranslate mirrors).
  const MYMEMORY_ENDPOINT = 'https://api.mymemory.translated.net/get';

  const sourceSel = document.getElementById('sourceLang');
  const targetSel = document.getElementById('targetLang');
  const inputText = document.getElementById('inputText');
  const output = document.getElementById('output');
  const statusEl = document.getElementById('status');
  const translateBtn = document.getElementById('translateBtn');
  const swapBtn = document.getElementById('swapBtn');
  const copyBtn = document.getElementById('copyOutput');
  const speakInBtn = document.getElementById('speakInput');
  const speakOutBtn = document.getElementById('speakOutput');
  const clearBtn = document.getElementById('clearInput');

  function populateSelects() {
    LANGS.forEach(l => {
      const o1 = document.createElement('option');
      o1.value = l.code; o1.textContent = l.name;
      sourceSel.appendChild(o1);

      const o2 = document.createElement('option');
      o2.value = l.code; o2.textContent = l.name;
      targetSel.appendChild(o2);
    });
    sourceSel.value = 'en';
    targetSel.value = 'fr';
  }
  populateSelects();

  function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.classList.toggle('error', isError);
  }

  async function tryTranslate(text, source, target) {
    const langpair = `${source}|${target}`;
    const url = `${MYMEMORY_ENDPOINT}?q=${encodeURIComponent(text)}&langpair=${encodeURIComponent(langpair)}`;

    const res = await fetch(url);
    if (!res.ok) throw new Error('Server responded with ' + res.status);

    const data = await res.json();
    const translated = data && data.responseData && data.responseData.translatedText;

    if (!translated) throw new Error('No translation returned');
    // MyMemory returns this exact phrase in the text field when the daily
    // free quota is hit, instead of a clean error code — catch it here.
    if (/MYMEMORY WARNING/i.test(translated)) {
      throw new Error('Daily free translation quota reached — try again tomorrow.');
    }
    return translated;
  }

  async function doTranslate() {
    const text = inputText.value.trim();
    if (!text) {
      setStatus('Type something to translate first.', true);
      return;
    }
    if (sourceSel.value === targetSel.value) {
      setStatus('Pick two different languages.', true);
      return;
    }

    translateBtn.disabled = true;
    translateBtn.textContent = 'Translating…';
    setStatus('');
    output.classList.add('placeholder');
    output.value = '';

    try {
      const translated = await tryTranslate(text, sourceSel.value, targetSel.value);
      output.value = translated;
      output.classList.remove('placeholder');
      copyBtn.disabled = false;
      speakOutBtn.disabled = false;
      setStatus('Done.');
    } catch (err) {
      output.value = '';
      output.classList.add('placeholder');
      setStatus(err && err.message ? err.message : 'Translation failed — try again in a moment.', true);
    } finally {
      translateBtn.disabled = false;
      translateBtn.textContent = 'Translate';
    }
  }

  translateBtn.addEventListener('click', doTranslate);

  inputText.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') doTranslate();
  });

  swapBtn.addEventListener('click', () => {
    const s = sourceSel.value;
    sourceSel.value = targetSel.value;
    targetSel.value = s;
    swapBtn.classList.add('spin');
    setTimeout(() => swapBtn.classList.remove('spin'), 200);

    if (output.value && !output.classList.contains('placeholder')) {
      const inVal = inputText.value;
      inputText.value = output.value;
      output.value = inVal;
    }
  });

  clearBtn.addEventListener('click', () => {
    inputText.value = '';
    output.value = '';
    output.classList.add('placeholder');
    copyBtn.disabled = true;
    speakOutBtn.disabled = true;
    setStatus('');
    inputText.focus();
  });

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(output.value);
      const orig = copyBtn.textContent;
      copyBtn.textContent = '✓ Copied';
      setTimeout(() => { copyBtn.textContent = orig; }, 1500);
    } catch {
      setStatus('Could not copy — select and copy manually.', true);
    }
  });

  function speak(text, langCode) {
    if (!('speechSynthesis' in window)) {
      setStatus('Text-to-speech is not supported in this browser.', true);
      return;
    }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = langCode;
    window.speechSynthesis.speak(utter);
  }

  speakInBtn.addEventListener('click', () => {
    if (inputText.value.trim()) speak(inputText.value, sourceSel.value);
  });

  speakOutBtn.addEventListener('click', () => {
    if (output.value.trim()) speak(output.value, targetSel.value);
  });
</script>
</body>
</html>
