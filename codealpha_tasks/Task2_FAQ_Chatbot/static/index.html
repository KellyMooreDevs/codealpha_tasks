<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Askline — Study Abroad FAQ Bot</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #F5F4EF;
    --panel: #FFFFFF;
    --ink: #23293A;
    --ink-soft: #5B6478;
    --accent: #3D6B52;
    --accent-soft: #E7EFE9;
    --bot-bubble: #EFEDE4;
    --user-bubble: #23293A;
    --border: #DEDACB;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 16px;
  }

  .app {
    width: 100%;
    max-width: 620px;
  }

  header {
    margin-bottom: 18px;
  }

  header h1 {
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 1.7rem;
    margin: 0 0 4px;
  }

  header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.92rem;
  }

  .chat-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    height: 62vh;
    min-height: 380px;
    overflow: hidden;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .bubble {
    max-width: 82%;
    padding: 11px 14px;
    border-radius: 12px;
    font-size: 0.95rem;
    line-height: 1.45;
    white-space: pre-wrap;
  }

  .bubble.bot {
    background: var(--bot-bubble);
    color: var(--ink);
    align-self: flex-start;
    border-bottom-left-radius: 3px;
  }

  .bubble.user {
    background: var(--user-bubble);
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 3px;
  }

  .bubble.typing {
    color: var(--ink-soft);
    font-style: italic;
  }

  .matched-hint {
    font-size: 0.76rem;
    color: var(--ink-soft);
    margin-top: 4px;
    align-self: flex-start;
    max-width: 82%;
  }

  form {
    display: flex;
    gap: 10px;
    padding: 14px;
    border-top: 1px solid var(--border);
  }

  input[type="text"] {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 11px 13px;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
  }

  input[type="text"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 7px;
    padding: 0 20px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.92rem;
    cursor: pointer;
  }

  button:disabled {
    background: #A9B3AB;
    cursor: default;
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }

  .chip {
    background: var(--accent-soft);
    color: var(--accent);
    border: none;
    border-radius: 20px;
    padding: 7px 13px;
    font-size: 0.82rem;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }

  .chip:hover { background: #DCEAE1; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Askline</h1>
    <p>Ask a question about applying to study abroad — visas, documents, flights, and more.</p>
  </header>

  <div class="chat-panel">
    <div class="messages" id="messages">
      <div class="bubble bot">Hi! Ask me anything about the study-abroad process — I'll do my best to help.</div>
    </div>
    <form id="chatForm">
      <input type="text" id="userInput" placeholder="Type your question…" autocomplete="off" maxlength="300">
      <button type="submit">Send</button>
    </form>
  </div>

  <div class="suggestions">
    <button class="chip" data-q="What documents do I need to apply?">What documents do I need?</button>
    <button class="chip" data-q="How do I get a student visa?">Student visa process</button>
    <button class="chip" data-q="Can you help book my flight?">Flight booking help</button>
  </div>
</div>

<script>
  const messages = document.getElementById('messages');
  const form = document.getElementById('chatForm');
  const input = document.getElementById('userInput');
  const chips = document.querySelectorAll('.chip');

  function addBubble(text, who) {
    const div = document.createElement('div');
    div.className = 'bubble ' + who;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  function addHint(text) {
    const div = document.createElement('div');
    div.className = 'matched-hint';
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  async function sendQuestion(question) {
    addBubble(question, 'user');
    input.value = '';

    const typingBubble = addBubble('Thinking…', 'bot typing');

    try {
      const res = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });
      const data = await res.json();

      typingBubble.remove();

      if (data.answer) {
        addBubble(data.answer, 'bot');
        addHint('Matched: "' + data.matched_question + '" (' + Math.round(data.confidence * 100) + '% match)');
      } else {
        addBubble("I'm not confident I have an answer for that. Try asking about visas, documents, flights, or English tests.", 'bot');
      }
    } catch (err) {
      typingBubble.remove();
      addBubble('Something went wrong reaching the server. Make sure app.py is running.', 'bot');
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (q) sendQuestion(q);
  });

  chips.forEach(chip => {
    chip.addEventListener('click', () => sendQuestion(chip.dataset.q));
  });
</script>
</body>
</html>
